- id: helm-hypothesis
  name: Test Helm chart values with Hypothesis
  description: Generate and run property tests for Helm chart values using the installed hypothesis plugin.
  entry: helm hypothesis test
  language: system
  pass_filenames: false
  require_serial: true
  files: (^|/)(Chart\.yaml|values[^/]*\.ya?ml|values\.schema\.json|templates/.*|charts/.*)$
- id: helm-hypothesis-minimal-values
  name: Export minimal example Helm values
  description: Write values-minimal.yaml examples and values-minimal.proof verification records beside each chart.
  entry: helm hypothesis export-minimal-values
  language: system
  pass_filenames: false
  require_serial: true
  files: (^|/)(Chart\.yaml|values[^/]*\.ya?ml|values\.schema\.json|templates/.*|charts/.*)$
