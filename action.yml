name: Hypothesis Helm
description: Test or audit local and remote Helm charts, generate and run saved suites, and report findings.
author: Emma Doyle
branding:
  icon: check-circle
  color: purple
inputs:
  chart:
    description: Local chart or source relative to the workspace; source takes precedence when supplied.
    default: .
  export-minimal-values:
    description: Export deterministic concrete values beside each chart after testing (shard 1 only).
    default: 'false'
  commit-minimal-values:
    description: Export example values and commit the YAML and verification proof files to the checked-out branch.
    default: 'false'
  minimal-values-filename:
    description: YAML basename in every discovered chart directory; directory overrides are rejected.
    default: values-minimal.yaml
  minimal-values-timeout:
    description: Verification and minimization budget per chart.
    default: 30s
  python-version:
    description: Python version (3.13 or newer).
    default: '3.13'
  binary-cache:
    description: Restore and save versioned Helm and optional Kubesec binaries between workflow runs.
    default: 'true'
  helm-version:
    description: Helm 4 version to install.
    default: v4.3.0
  shard:
    description: 'auto detects CI coordinates; INDEX/TOTAL overrides; none disables sharding.'
    default: auto
  job-index:
    description: 'Zero-based GitHub strategy.job-index; pass this from a matrix workflow.'
    default: ''
  job-total:
    description: 'GitHub strategy.job-total; pass this from a matrix workflow.'
    default: ''
  jobs:
    description: 'auto tunes worker concurrency per runner; a positive integer fixes the limit.'
    default: auto
  run-id:
    description: Common run identifier for combining all shards into one final report.
    default: ''
  max-examples:
    description: Maximum Hypothesis examples per property; empty inherits config, then the CLI default (test/scan 10, generate 100).
    default: ''
  sample-random:
    description: Percentage of eligible path properties to retain; 100 disables sampling.
    default: ''
  sample-min-cases:
    description: Minimum retained sample; smaller suites run in full.
    default: ''
  seed:
    description: Shared Hypothesis seed for reproducible runs.
    default: ''
  timeout:
    description: Timeout in seconds per Helm render.
    default: ''
  match:
    description: Optional pytest keyword expression applied before sharding.
    default: ''
  schema-validation:
    description: 'Validate Kubernetes API schemas; with Kubesec, route validation through the security dispatcher.'
    default: 'true'
  kubesec:
    description: Route fresh and verified cached manifests to Kubesec and other resources to native schema validation.
    default: 'false'
  kubesec-version:
    description: Kubesec release to install.
    default: v2.14.2
  kubesec-jobs:
    description: 'auto uses this runner process CPU count; a positive integer overrides it.'
    default: auto
  kubesec-score-minimum:
    description: 'Minimum acceptable score for every Kubesec resource; equality passes. Invalid manifests and scanner errors always fail.'
    default: '0'
  kubesec-binary:
    description: Path or name of a preinstalled Kubesec executable.
    default: kubesec
  schema-cache:
    description: Restore and save Kubernetes schemas between workflow runs.
    default: 'true'
  schema-version:
    description: Kubernetes schema version, latest stable or exact X.Y.Z.
    default: latest
  schema-cache-dir:
    description: Sparse schema checkout and immutable snapshot cache.
    default: schemas
  schema-memory-dir:
    description: Optional directory on a Linux tmpfs mount, such as /dev/shm/helm-schemas
    default: ''
  schema-offline:
    description: Use restored schemas without fetching upstream.
    default: 'false'
  cache-dir:
    description: Optional persistent path-result cache directory to restore with your CI cache.
    default: ''
  cache:
    description: Enable disk caching of successful and failed paths.
    default: 'true'
  disable-schema-caching:
    description: Compare against restored values structure markers without overwriting them.
    default: 'false'
  rerun:
    description: 'auto runs all paths unless incremental is enabled; failed retries failures and uncached paths; all forces a full run.'
    default: auto
  incremental:
    description: 'With rerun auto, reuse successful properties of Git-unchanged charts; requires restored outcomes and comparison history.'
    default: 'false'
  base-ref:
    description: 'Override the incremental comparison reference; otherwise use the PR target or previous trunk commit.'
    default: ''
  artifact-dir:
    description: Artifact root; sharded runs append shards/INDEX-of-TOTAL.
    default: .cache/hypothesis-helm/runs
  upload-artifacts:
    description: Upload the generated suite, reports, and JSON manifests, including on failure.
    default: 'true'
  artifact-name:
    description: Artifact name prefix; job name and shard identifier are appended.
    default: hypothesis-helm
  artifact-retention-days:
    description: Report retention in days, subject to repository policy; does not change CI cache eviction.
    default: '30'
  command:
    description: 'CLI command: test (local charts), scan (remote sources), audit, generate, or run (saved suite).'
    default: test
  source:
    description: Chart directory, remote repository/chart reference, or saved suite directory. When empty, use chart.
    default: ''
  config-inline:
    description: Inline policy YAML merged over config. Mappings merge; lists and scalars replace. Relative paths use the workspace.
    default: ''
  report:
    description: 'Write Markdown/PDF reports; true writes scan.md/pdf inside artifacts, a path chooses a location, false or empty omits.'
    default: ''
  pca-samples:
    description: 'with --report, measure up to N reference configurations per chart for output PCA; 0 disables it (default: 64)'
    default: ''
  pca-timeout:
    description: 'additional output-PCA measurement budget per chart with --report (default: 1m)'
    default: ''
  max-mutations:
    description: with --report, measure sensitivity for up to N fields per chart and all their pairs (opt-in)
    default: ''
  sensitivity-timeout:
    description: 'additional sensitivity measurement budget per chart with --max-mutations (default: 3m)'
    default: ''
  values:
    description: baseline file relative to each chart, or an absolute path
    default: ''
  chart-timeout:
    description: 'property-test budget per discovered chart (default: 3m)'
    default: ''
  scan-timeout:
    description: total local discovery/testing budget, excluding dependency preparation
    default: ''
  build-dependencies:
    description: build dependencies in isolated copies; true/false, empty inherits the CLI/config default
    default: ''
  fail:
    description: 'stop at this severity or higher and exit 1; bare flag: any finding; lower findings remain reported; true uses the default, false
      or empty omits'
    default: ''
  time-limit:
    description: 'whole-chart execution budget, e.g. 30s or 3m (default: 3m); excludes planning'
    default: ''
  paths:
    description: force generated per-path testing; true enables, false or empty omits
    default: ''
  exhaustive:
    description: enumerate finite whole-chart inputs; true enables, false or empty omits
    default: ''
  whole-chart:
    description: sample whole-chart inputs; true enables, false or empty omits
    default: ''
  permutations:
    description: cover valid N-way finite interactions; non-finite charts fall back to path sampling
    default: ''
  filter:
    description: enable --filter-topology 2 and --expand-failures; true enables, false or empty omits
    default: ''
  filter-random:
    description: 'retain a seeded quarter of finite permutation cases per step; default: 0'
    default: ''
  filter-topology:
    description: thin symbolic output/branch regions; retain representatives and unknowns; combines with --filter-random
    default: ''
  expand-failures:
    description: test omitted members of failed symbolic regions within the execution budget; true enables, false or empty omits
    default: ''
  prune-equivalent:
    description: skip Helm only for proved output equivalence to a successful render; true enables, false or empty omits
    default: ''
  collect-only:
    description: generate and list tests; true enables, false or empty omits
    default: ''
  max-cases:
    description: bound exhaustive domains or permutation suites and factor domains
    default: ''
  max-candidates:
    description: bound permutation planning work
    default: ''
  exhaustive-threshold:
    description: enumerate finite spaces smaller than this count; 0 disables promotion
    default: ''
  exhaustive-group:
    description: require exhaustive coverage of a group of value paths or containers; repeatable; one comma-separated group per line
    default: ''
  no-infer-groups:
    description: disable inferred exhaustive groups; true enables, false or empty omits
    default: ''
  max-group-cases:
    description: bound automatically inferred group domains
    default: ''
  filter-adaptive:
    description: enable --filter and retain 70% subject to measured topology sample floors; unmatched charts keep all filtered cases; true
      enables, false or empty omits
    default: ''
  sampling-calibration:
    description: override the packaged adaptive-sampling calibration JSON
    default: ''
  sensitivity-order:
    description: 'maximum measured interaction order for sensitivity-first; 1..permutations, default: min(2, permutations)'
    default: ''
  traversal-strategy:
    description: seeded random (default), linear, root-first, leaf-first, or sensitivity-first (finite coverage defaults to pairs)
    default: ''
  helm:
    description: helm
    default: ''
  release:
    description: release
    default: ''
  namespace:
    description: namespace
    default: ''
  kube-version:
    description: kube-version
    default: ''
  allow-empty:
    description: allow-empty; true enables, false or empty omits
    default: ''
  strict:
    description: require schemas for custom resources; otherwise skip schema validation when their schema is missing; true/false, empty
      inherits the CLI/config default
    default: ''
  dry-run:
    description: plot coverage and forecast filtering or cached property work without execution; true enables, false or empty omits
    default: ''
  progress:
    description: force a live progress bar on stderr, including redirected output; true enables, false or empty omits
    default: ''
  output-format:
    description: stream rendered manifests as JSON lines or YAML documents on stdout; logs and reports go to stderr
    default: ''
  export-suppressions:
    description: write categorized suppressions.yaml in each chart's artifacts after testing; review before applying; true enables, false or
      empty omits
    default: ''
  export-topological-graph:
    description: 'Export JSON/DOT input-output graphs; true writes topology.json inside artifacts, or provide a filename.'
    default: ''
  log-color:
    description: 'Color severity labels: auto, always or never. true selects always; false selects never; empty inherits the CLI default.'
    default: ''
  log-file:
    description: 'Append logs to this file; empty keeps diagnostics visible on stderr while stdout is saved as an Action output.'
    default: ''
  config:
    description: 'finding and input-domain policy YAML; default: .hypothesis-helm.yaml in the working directory'
    default: ''
  character-sets:
    description: 'generated text alphabet; overrides config; default: ascii'
    default: ''
  renderer-policy:
    description: auto controls supported random inputs with visible native fallback (default); native uses Helm; strict requires replay
    default: ''
  yaml-parser:
    description: "manifest parser backend; overrides yaml_parser in config; default: ruamel, or the saved suite's parser"
    default: ''
  ignore:
    description: disable one built-in check; repeat to add codes; one code per line
    default: ''
  disable-codes:
    description: disable comma-delimited finding codes; adds to --ignore and the config file; repeatable
    default: ''
  helm-repository:
    description: interpret SOURCE as a Helm repository name or HTTP(S) base URL; true enables, false or empty omits
    default: ''
  chart-version:
    description: 'Helm chart version or constraint; default: latest stable release per chart'
    default: ''
  clone-timeout:
    description: 'Git checkout or Helm source preparation budget, also bounded by --scan-timeout (default: 3m)'
    default: ''
  suite-output:
    description: 'Generated suite directory (generate --output); empty writes generated-tests inside the artifact directory.'
    default: ''
outputs:
  suite-path:
    description: Generated suite directory for command generate.
    value: ${{ steps.test.outputs.suite-path }}
  report-path:
    description: Requested Markdown report location; may not exist after setup failure.
    value: ${{ steps.test.outputs.report-path }}
  pdf-path:
    description: Requested PDF report location; may not exist after setup failure.
    value: ${{ steps.test.outputs.pdf-path }}
  command-output:
    description: Captured stdout for audit, generation, dry-run or collection.
    value: ${{ steps.test.outputs.command-output }}
  report-dir:
    description: Absolute path to this shard's artifact directory.
    value: ${{ steps.test.outputs.report-dir }}
  junit-path:
    description: Absolute path to the JUnit report.
    value: ${{ steps.test.outputs.junit-path }}
  manifest-path:
    description: Absolute path to the manifest stream (JSON Lines or YAML); empty for non-rendering commands.
    value: ${{ steps.test.outputs.manifest-path }}
  shard:
    description: Resolved one-based shard coordinates, or none.
    value: ${{ steps.test.outputs.shard }}
  kubesec-report-dir:
    description: This shard's Kubesec report directory.
    value: ${{ steps.test.outputs.kubesec-report-dir }}
  kubesec-exit-code:
    description: Kubesec scan exit code when enabled.
    value: ${{ steps.test.outputs.kubesec-exit-code }}
  exit-code:
    description: Combined Helm and optional Kubesec status; Helm failures take precedence.
    value: ${{ steps.test.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Check runner support
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Linux" && "$RUNNER_OS" != "macOS" ]]; then
            echo "::error::Hypothesis Helm requires a Linux or macOS runner."
            exit 1
        fi
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Restore Helm binary
      id: helm-cache
      if: ${{ inputs.binary-cache == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ inputs.helm-version }}-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
        key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ inputs.helm-version }}-exact
    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
        BINARY_CACHE: ${{ inputs.binary-cache }}
      run: |
        case "$RUNNER_OS" in
            Linux)
                platform=linux
                ;;
            macOS)
                platform=darwin
                ;;
        esac
        case "$RUNNER_ARCH" in
            X64)
                architecture=amd64
                ;;
            ARM64)
                architecture=arm64
                ;;
            *)
                exit 1
                ;;
        esac
        binary_root="$RUNNER_TEMP/hypothesis-helm-binaries"
        if [[ "$BINARY_CACHE" != "true" ]]; then
            binary_root="$(mktemp -d "$RUNNER_TEMP/hh-binaries.XXXXXX")"
        fi
        binary_dir="$binary_root/helm-${HELM_VERSION}-${platform}-${architecture}"
        if [[ ! -x "$binary_dir/helm" ]]; then
            download_dir="$(mktemp -d)"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-${platform}-${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
            tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" "${platform}-${architecture}/helm"
            mkdir -p "$binary_dir"
            install "$download_dir/${platform}-${architecture}/helm" "$binary_dir/helm.pending"
            mv "$binary_dir/helm.pending" "$binary_dir/helm"
            rm -rf "$download_dir"
        fi
        echo "$binary_dir" >>"$GITHUB_PATH"
    - name: Save Helm binary
      if: ${{ inputs.binary-cache == 'true' && steps.helm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ inputs.helm-version }}-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
        key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ inputs.helm-version }}-exact
    - name: Install this action's Helm plugin
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        plugin_root="$(mktemp -d "$RUNNER_TEMP/hypothesis-helm.XXXXXX")"
        export HELM_DATA_HOME="$plugin_root"
        export HELM_PLUGINS="$HELM_DATA_HOME/plugins"
        PYTHON=python helm plugin install "$ACTION_PATH"
        helm hypothesis --help
        echo "data=$HELM_DATA_HOME" >>"$GITHUB_OUTPUT"
        echo "plugins=$HELM_PLUGINS" >>"$GITHUB_OUTPUT"
    - name: Restore Kubesec binary
      id: kubesec-cache
      if: ${{ inputs.binary-cache == 'true' && (inputs.kubesec == 'true' && inputs.kubesec-binary == 'kubesec') }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/hypothesis-helm-binaries/kubesec-${{ inputs.kubesec-version }}-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
        key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-kubesec-${{ inputs.kubesec-version }}-exact
    - name: Install Kubesec
      if: ${{ inputs.kubesec == 'true' && inputs.kubesec-binary == 'kubesec' }}
      shell: bash
      env:
        KUBESEC_VERSION: ${{ inputs.kubesec-version }}
        BINARY_CACHE: ${{ inputs.binary-cache }}
      run: |
        case "$RUNNER_OS" in
            Linux)
                platform=linux
                ;;
            macOS)
                platform=darwin
                ;;
        esac
        case "$RUNNER_ARCH" in
            X64)
                architecture=amd64
                ;;
            ARM64)
                architecture=arm64
                ;;
            *)
                exit 1
                ;;
        esac
        binary_root="$RUNNER_TEMP/hypothesis-helm-binaries"
        if [[ "$BINARY_CACHE" != "true" ]]; then
            binary_root="$(mktemp -d "$RUNNER_TEMP/hh-binaries.XXXXXX")"
        fi
        binary_dir="$binary_root/kubesec-${KUBESEC_VERSION}-${platform}-${architecture}"
        if [[ ! -x "$binary_dir/kubesec" ]]; then
            download_dir="$(mktemp -d)"
            curl -fsSL "https://github.com/controlplaneio/kubesec/releases/download/${KUBESEC_VERSION}/kubesec_${platform}_${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
            tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" kubesec
            mkdir -p "$binary_dir"
            install "$download_dir/kubesec" "$binary_dir/kubesec.pending"
            mv "$binary_dir/kubesec.pending" "$binary_dir/kubesec"
            rm -rf "$download_dir"
        fi
        echo "$binary_dir" >>"$GITHUB_PATH"
    - name: Save Kubesec binary
      if: ${{ inputs.binary-cache == 'true' && steps.kubesec-cache.outputs.cache-hit != 'true' && (inputs.kubesec == 'true' && inputs.kubesec-binary == 'kubesec') }}
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/hypothesis-helm-binaries/kubesec-${{ inputs.kubesec-version }}-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
        key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-kubesec-${{ inputs.kubesec-version }}-exact
    - name: Restore Kubernetes schemas
      id: schemas
      if: ${{ (inputs.schema-validation == 'true' || inputs.kubesec == 'true') && inputs.schema-cache == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.schema-cache-dir }}
        key: helm-schemas-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.schema-version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.job-index }}
        restore-keys: |
          helm-schemas-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.schema-version }}-
    - name: Prepare local Kubernetes schemas
      if: ${{ inputs.schema-validation == 'true' || inputs.kubesec == 'true' }}
      shell: bash
      env:
        HELM_DATA_HOME: ${{ steps.install.outputs.data }}
        HELM_PLUGINS: ${{ steps.install.outputs.plugins }}
        HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: ${{ inputs.schema-memory-dir }}
        SCHEMA_VERSION: ${{ inputs.schema-version }}
        SCHEMA_CACHE_DIR: ${{ inputs.schema-cache-dir }}
        SCHEMA_OFFLINE: ${{ inputs.schema-offline }}
      run: |
        if [[ "$SCHEMA_OFFLINE" == "true" ]]; then
            helm hypothesis schemas --schema-version "$SCHEMA_VERSION" \
                --schema-cache-dir "$SCHEMA_CACHE_DIR" \
                --schema-offline
        else
            helm hypothesis schemas --schema-version "$SCHEMA_VERSION" \
                --schema-cache-dir "$SCHEMA_CACHE_DIR"
        fi
    - name: Test chart values
      id: test
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HELM_DATA_HOME: ${{ steps.install.outputs.data }}
        HELM_PLUGINS: ${{ steps.install.outputs.plugins }}
        HYPOTHESIS_HELM_JOB_INDEX: ${{ inputs.job-index }}
        HYPOTHESIS_HELM_JOB_TOTAL: ${{ inputs.job-total }}
        HH_CHART: ${{ inputs.chart }}
        HH_COMMAND: ${{ inputs.command }}
        HH_SOURCE: ${{ inputs.source }}
        HH_CONFIG_INLINE: ${{ inputs.config-inline }}
        HH_REPORT: ${{ inputs.report }}
        HH_PCA_SAMPLES: ${{ inputs.pca-samples }}
        HH_PCA_TIMEOUT: ${{ inputs.pca-timeout }}
        HH_MAX_MUTATIONS: ${{ inputs.max-mutations }}
        HH_SENSITIVITY_TIMEOUT: ${{ inputs.sensitivity-timeout }}
        HH_VALUES: ${{ inputs.values }}
        HH_CHART_TIMEOUT: ${{ inputs.chart-timeout }}
        HH_SCAN_TIMEOUT: ${{ inputs.scan-timeout }}
        HH_BUILD_DEPENDENCIES: ${{ inputs.build-dependencies }}
        HH_FAIL: ${{ inputs.fail }}
        HH_TIME_LIMIT: ${{ inputs.time-limit }}
        HH_PATHS: ${{ inputs.paths }}
        HH_EXHAUSTIVE: ${{ inputs.exhaustive }}
        HH_WHOLE_CHART: ${{ inputs.whole-chart }}
        HH_PERMUTATIONS: ${{ inputs.permutations }}
        HH_FILTER: ${{ inputs.filter }}
        HH_FILTER_RANDOM: ${{ inputs.filter-random }}
        HH_FILTER_TOPOLOGY: ${{ inputs.filter-topology }}
        HH_EXPAND_FAILURES: ${{ inputs.expand-failures }}
        HH_PRUNE_EQUIVALENT: ${{ inputs.prune-equivalent }}
        HH_COLLECT_ONLY: ${{ inputs.collect-only }}
        HH_MAX_CASES: ${{ inputs.max-cases }}
        HH_MAX_CANDIDATES: ${{ inputs.max-candidates }}
        HH_EXHAUSTIVE_THRESHOLD: ${{ inputs.exhaustive-threshold }}
        HH_EXHAUSTIVE_GROUP: ${{ inputs.exhaustive-group }}
        HH_NO_INFER_GROUPS: ${{ inputs.no-infer-groups }}
        HH_MAX_GROUP_CASES: ${{ inputs.max-group-cases }}
        HH_FILTER_ADAPTIVE: ${{ inputs.filter-adaptive }}
        HH_SAMPLING_CALIBRATION: ${{ inputs.sampling-calibration }}
        HH_SENSITIVITY_ORDER: ${{ inputs.sensitivity-order }}
        HH_TRAVERSAL_STRATEGY: ${{ inputs.traversal-strategy }}
        HH_HELM: ${{ inputs.helm }}
        HH_RELEASE: ${{ inputs.release }}
        HH_NAMESPACE: ${{ inputs.namespace }}
        HH_KUBE_VERSION: ${{ inputs.kube-version }}
        HH_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        HH_STRICT: ${{ inputs.strict }}
        HH_DRY_RUN: ${{ inputs.dry-run }}
        HH_PROGRESS: ${{ inputs.progress }}
        HH_OUTPUT_FORMAT: ${{ inputs.output-format }}
        HH_EXPORT_SUPPRESSIONS: ${{ inputs.export-suppressions }}
        HH_EXPORT_TOPOLOGICAL_GRAPH: ${{ inputs.export-topological-graph }}
        HH_LOG_COLOR: ${{ inputs.log-color }}
        HH_LOG_FILE: ${{ inputs.log-file }}
        HH_CONFIG: ${{ inputs.config }}
        HH_CHARACTER_SETS: ${{ inputs.character-sets }}
        HH_RENDERER_POLICY: ${{ inputs.renderer-policy }}
        HH_YAML_PARSER: ${{ inputs.yaml-parser }}
        HH_IGNORE: ${{ inputs.ignore }}
        HH_DISABLE_CODES: ${{ inputs.disable-codes }}
        HH_HELM_REPOSITORY: ${{ inputs.helm-repository }}
        HH_CHART_VERSION: ${{ inputs.chart-version }}
        HH_CLONE_TIMEOUT: ${{ inputs.clone-timeout }}
        HH_SUITE_OUTPUT: ${{ inputs.suite-output }}
        HH_SHARD: ${{ inputs.shard }}
        HH_JOBS: ${{ inputs.jobs }}
        HH_RUN_ID: ${{ inputs.run-id }}
        HH_MAX_EXAMPLES: ${{ inputs.max-examples }}
        HH_SEED: ${{ inputs.seed }}
        HH_SAMPLE_RANDOM: ${{ inputs.sample-random }}
        HH_SAMPLE_MIN_CASES: ${{ inputs.sample-min-cases }}
        HH_TIMEOUT: ${{ inputs.timeout }}
        HH_MATCH: ${{ inputs.match }}
        HH_VALIDATE_SCHEMAS: ${{ inputs.schema-validation }}
        HH_KUBESEC: ${{ inputs.kubesec }}
        HH_KUBESEC_JOBS: ${{ inputs.kubesec-jobs }}
        HH_KUBESEC_SCORE_MINIMUM: ${{ inputs.kubesec-score-minimum }}
        HH_KUBESEC_BINARY: ${{ inputs.kubesec-binary }}
        HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: ${{ inputs.schema-memory-dir }}
        HH_SCHEMA_VERSION: ${{ inputs.schema-version }}
        HH_SCHEMA_CACHE_DIR: ${{ inputs.schema-cache-dir }}
        HH_SCHEMA_OFFLINE: 'true'
        HH_CACHE_DIR: ${{ inputs.cache-dir }}
        HH_CACHE: ${{ inputs.cache }}
        HH_DISABLE_SCHEMA_CACHING: ${{ inputs.disable-schema-caching }}
        HH_RERUN: ${{ inputs.rerun }}
        HH_INCREMENTAL: ${{ inputs.incremental }}
        HH_BASE_REF: ${{ inputs.base-ref }}
        HH_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
        HH_EXPORT_MINIMAL_VALUES: ${{ inputs.export-minimal-values }}
        HH_COMMIT_MINIMAL_VALUES: ${{ inputs.commit-minimal-values }}
        HH_MINIMAL_VALUES_FILENAME: ${{ inputs.minimal-values-filename }}
        HH_MINIMAL_VALUES_TIMEOUT: ${{ inputs.minimal-values-timeout }}
      run: '"$ACTION_PATH/.plugin-venv/bin/hypothesis-helm-github-action"'
    - name: Export minimal example values
      if: ${{ always() && steps.test.outputs.effective-config-ready == 'true' && inputs.command != 'scan' && inputs.command != 'run' && (inputs.export-minimal-values == 'true' || inputs.commit-minimal-values == 'true') }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HELM_DATA_HOME: ${{ steps.install.outputs.data }}
        HELM_PLUGINS: ${{ steps.install.outputs.plugins }}
        HH_CHART: ${{ inputs.source || inputs.chart }}
        HH_CONFIG: ${{ steps.test.outputs.effective-config }}
        HH_HELM: ${{ inputs.helm }}
        HH_TIMEOUT: ${{ inputs.timeout }}
        HH_CHARACTER_SETS: ${{ inputs.character-sets }}
        HH_RENDERER_POLICY: ${{ inputs.renderer-policy }}
        HH_YAML_PARSER: ${{ inputs.yaml-parser }}
        HH_RESOLVED_SHARD: ${{ steps.test.outputs.shard }}
        HH_MINIMAL_VALUES_FILENAME: ${{ inputs.minimal-values-filename }}
        HH_MINIMAL_VALUES_TIMEOUT: ${{ inputs.minimal-values-timeout }}
        HH_VALIDATE_SCHEMAS: ${{ inputs.schema-validation }}
        HH_KUBESEC: ${{ inputs.kubesec }}
        HH_SCHEMA_VERSION: ${{ inputs.schema-version }}
        HH_SCHEMA_CACHE_DIR: ${{ inputs.schema-cache-dir }}
        HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: ${{ inputs.schema-memory-dir }}
        HH_COMMIT_MINIMAL_VALUES: ${{ inputs.commit-minimal-values }}
        HH_COMMIT_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
      run: bash "$ACTION_PATH/pkg/hypothesis_helm/integrations/minimal_values.sh"
    - name: Save Kubernetes schemas
      if: ${{ always() && (inputs.schema-validation == 'true' || inputs.kubesec == 'true') && inputs.schema-cache == 'true' && steps.schemas.outputs.cache-primary-key != '' && steps.schemas.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.schema-cache-dir }}
        key: ${{ steps.schemas.outputs.cache-primary-key }}
    - name: Upload this shard's results
      if: ${{ always() && inputs.upload-artifacts == 'true' && steps.test.outputs.report-dir != '' }}
      uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true
        name: ${{ inputs.artifact-name }}-${{ github.job }}-${{ steps.test.outputs.shard-id }}
        path: |
          ${{ steps.test.outputs.report-dir }}
          ${{ steps.test.outputs.report-path }}
          ${{ steps.test.outputs.pdf-path }}
          ${{ steps.test.outputs.report-images }}
          ${{ steps.test.outputs.suite-path }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Upload this shard's security results
      if: ${{ always() && inputs.upload-artifacts == 'true' && steps.test.outputs.kubesec-report-dir != '' }}
      uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true
        name: ${{ inputs.artifact-name }}-kubesec-${{ github.job }}-${{ steps.test.outputs.shard-id }}
        path: ${{ steps.test.outputs.kubesec-report-dir }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
