version: 2.1
description: Test Helm charts with cached schemas and optional security scans.
commands:
  test:
    description: Test chart values with an installed Helm plugin and automatic CI sharding.
    parameters:
      chart:
        type: string
        default: ./chart
      jobs:
        type: string
        default: auto
      max-examples:
        type: integer
        default: 100
      sample-random:
        type: string
        default: "100"
      sample-min-cases:
        type: integer
        default: 128
      seed:
        type: integer
        default: 0
      schema-version:
        type: string
        default: latest
      kubesec:
        type: boolean
        default: false
      kubesec-jobs:
        type: string
        default: auto
      schema-memory-dir:
        type: string
        default: ""
      schema-cache-dir:
        type: string
        default: .cache/hypothesis-helm/schemas
      artifact-dir:
        type: string
        default: reports/hypothesis-helm
      report-group:
        type: string
        default: chart
      defer-failure:
        type: boolean
        default: false
    steps:
      - run:
          name: Test Helm chart values
          environment:
            HH_KUBESEC: "<< parameters.kubesec >>"
            HH_KUBESEC_JOBS: << parameters.kubesec-jobs >>
            HH_CHART: << parameters.chart >>
            HH_JOBS: << parameters.jobs >>
            HH_MAX_EXAMPLES: << parameters.max-examples >>
            HH_SEED: << parameters.seed >>
            HH_SAMPLE_RANDOM: << parameters.sample-random >>
            HH_SAMPLE_MIN_CASES: << parameters.sample-min-cases >>
            HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: << parameters.schema-memory-dir >>
            HH_SCHEMA_VERSION: << parameters.schema-version >>
            HH_SCHEMA_CACHE_DIR: << parameters.schema-cache-dir >>
            HH_ARTIFACT_DIR: << parameters.artifact-dir >>
            HH_REPORT_GROUP: << parameters.report-group >>
            HH_DEFER_FAILURE: "<< parameters.defer-failure >>"
          command: |
            mkdir -p "$HH_ARTIFACT_DIR"
            test_status=0
            if [[ "$HH_KUBESEC" == "true" ]]; then
              helm hypothesis test "$HH_CHART" \
                --jobs "$HH_JOBS" --max-examples "$HH_MAX_EXAMPLES" --seed "$HH_SEED" \
                --sample-random "$HH_SAMPLE_RANDOM" --sample-min-cases "$HH_SAMPLE_MIN_CASES" \
                --schema-version "$HH_SCHEMA_VERSION" --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" \
                --schema-offline --shard "$((${CIRCLE_NODE_INDEX:-0} + 1))/${CIRCLE_NODE_TOTAL:-1}" --rerun all \
                --run-id "${CIRCLE_WORKFLOW_ID}-${HH_REPORT_GROUP}" \
                --artifact-dir "$HH_ARTIFACT_DIR" --output json \
                > "$HH_ARTIFACT_DIR/manifests-${CIRCLE_NODE_INDEX:-0}.jsonl" || test_status=$?
              kubesec_cli="$(helm env HELM_PLUGINS)/hypothesis/.plugin-venv/bin/hypothesis-helm-kubesec"
              scan_status=0
              "$kubesec_cli" \
                "$HH_ARTIFACT_DIR/manifests-${CIRCLE_NODE_INDEX:-0}.jsonl" \
                --output "$HH_ARTIFACT_DIR/kubesec" --jobs "$HH_KUBESEC_JOBS" \
                --shard auto --pre-sharded --validate-rest --schema-version "$HH_SCHEMA_VERSION" \
                --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" --schema-offline || scan_status=$?
              if ((test_status == 0)); then test_status=$scan_status; fi
            else
              helm hypothesis test "$HH_CHART" \
                --jobs "$HH_JOBS" --max-examples "$HH_MAX_EXAMPLES" --seed "$HH_SEED" \
                --sample-random "$HH_SAMPLE_RANDOM" --sample-min-cases "$HH_SAMPLE_MIN_CASES" \
                --schema-version "$HH_SCHEMA_VERSION" --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" \
                --kubeconform --schema-offline --shard "$((${CIRCLE_NODE_INDEX:-0} + 1))/${CIRCLE_NODE_TOTAL:-1}" --rerun all \
                --run-id "${CIRCLE_WORKFLOW_ID}-${HH_REPORT_GROUP}" \
                --artifact-dir "$HH_ARTIFACT_DIR" --output json \
                > "$HH_ARTIFACT_DIR/manifests-${CIRCLE_NODE_INDEX:-0}.jsonl" || test_status=$?
            fi
            echo "$test_status" > "$HH_ARTIFACT_DIR/exit-code.txt"
            if [[ "$HH_DEFER_FAILURE" != "true" ]]; then exit "$test_status"; fi
jobs:
  test-chart:
    description: Install Hypothesis Helm and test a chart with automatic sharding.
    parameters:
      binary-cache:
        type: boolean
        default: true
      chart:
        type: string
        default: ./chart
      plugin-path:
        type: string
        default: https://github.com/astrivant/hypothesis-helm
      kubesec-version:
        type: string
        default: v2.14.2
      kubeconform-version:
        type: string
        default: v0.7.0
      helm-version:
        type: string
        default: v4.3.0
      parallelism:
        type: integer
        default: 1
      jobs:
        type: string
        default: auto
      max-examples:
        type: integer
        default: 100
      sample-random:
        type: string
        default: "100"
      sample-min-cases:
        type: integer
        default: 128
      seed:
        type: integer
        default: 0
      schema-version:
        type: string
        default: latest
      kubesec:
        type: boolean
        default: false
      kubesec-jobs:
        type: string
        default: auto
      schema-memory-dir:
        type: string
        default: ""
      schema-offline:
        type: boolean
        default: false
      schema-cache-dir:
        type: string
        default: .cache/hypothesis-helm/schemas
      artifact-dir:
        type: string
        default: reports/hypothesis-helm
      report-group:
        type: string
        default: chart
    docker:
      - image: cimg/python:3.13
    parallelism: << parameters.parallelism >>
    retention:
      caches: 15d
    steps:
      - checkout
      - restore_cache:
          keys:
            - helm-schemas-v1-{{ arch }}-<< parameters.schema-version >>-
      - when:
          condition: << parameters.binary-cache >>
          steps:
            - restore_cache:
                keys:
                  - hh-binary-v1-linux-amd64-helm-<< parameters.helm-version >>-exact
            - restore_cache:
                keys:
                  - hh-binary-v1-linux-amd64-kubeconform-<< parameters.kubeconform-version >>-exact
            - restore_cache:
                keys:
                  - hh-binary-v1-linux-amd64-kubesec-<< parameters.kubesec-version >>-exact
      - run:
          name: Install Helm and validators
          environment:
            HH_KUBESEC: "<< parameters.kubesec >>"
            HH_KUBESEC_VERSION: << parameters.kubesec-version >>
            HH_KUBECONFORM_VERSION: << parameters.kubeconform-version >>
            HH_HELM_VERSION: << parameters.helm-version >>
            HH_BINARY_CACHE: "<< parameters.binary-cache >>"
          command: |
            platform=linux
            architecture=amd64
            binary_root=".cache/hypothesis-helm/binaries"
            if [[ "$HH_BINARY_CACHE" != "true" ]]; then binary_root="$(mktemp -d)"; fi
            binary_dir="$binary_root/helm-${HH_HELM_VERSION}-${platform}-${architecture}"
            if [[ ! -x "$binary_dir/helm" ]]; then
              download_dir="$(mktemp -d)"
              curl -fsSL "https://get.helm.sh/helm-${HH_HELM_VERSION}-${platform}-${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
              tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" "${platform}-${architecture}/helm"
              mkdir -p "$binary_dir"
              install "$download_dir/${platform}-${architecture}/helm" "$binary_dir/helm.pending"
              mv "$binary_dir/helm.pending" "$binary_dir/helm"
              rm -rf "$download_dir"
            fi
            sudo install "$binary_dir/helm" /usr/local/bin/helm
            binary_dir="$binary_root/kubeconform-${HH_KUBECONFORM_VERSION}-${platform}-${architecture}"
            if [[ ! -x "$binary_dir/kubeconform" ]]; then
              download_dir="$(mktemp -d)"
              curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${HH_KUBECONFORM_VERSION}/kubeconform-${platform}-${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
              tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" kubeconform
              mkdir -p "$binary_dir"
              install "$download_dir/kubeconform" "$binary_dir/kubeconform.pending"
              mv "$binary_dir/kubeconform.pending" "$binary_dir/kubeconform"
              rm -rf "$download_dir"
            fi
            sudo install "$binary_dir/kubeconform" /usr/local/bin/kubeconform
            if [[ "$HH_KUBESEC" == "true" ]]; then
              sudo apt-get update
              sudo apt-get install -y parallel
              binary_dir="$binary_root/kubesec-${HH_KUBESEC_VERSION}-${platform}-${architecture}"
              if [[ ! -x "$binary_dir/kubesec" ]]; then
                download_dir="$(mktemp -d)"
                curl -fsSL "https://github.com/controlplaneio/kubesec/releases/download/${HH_KUBESEC_VERSION}/kubesec_${platform}_${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
                tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" kubesec
                mkdir -p "$binary_dir"
                install "$download_dir/kubesec" "$binary_dir/kubesec.pending"
                mv "$binary_dir/kubesec.pending" "$binary_dir/kubesec"
                rm -rf "$download_dir"
              fi
              sudo install "$binary_dir/kubesec" /usr/local/bin/kubesec
            fi
      - when:
          condition: << parameters.binary-cache >>
          steps:
            - save_cache:
                key: hh-binary-v1-linux-amd64-helm-<< parameters.helm-version >>-exact
                paths:
                  - .cache/hypothesis-helm/binaries/helm-<< parameters.helm-version >>-linux-amd64
            - save_cache:
                key: hh-binary-v1-linux-amd64-kubeconform-<< parameters.kubeconform-version >>-exact
                paths:
                  - .cache/hypothesis-helm/binaries/kubeconform-<< parameters.kubeconform-version >>-linux-amd64
            - when:
                condition: << parameters.kubesec >>
                steps:
                  - save_cache:
                      key: hh-binary-v1-linux-amd64-kubesec-<< parameters.kubesec-version >>-exact
                      paths:
                        - .cache/hypothesis-helm/binaries/kubesec-<< parameters.kubesec-version >>-linux-amd64
      - run:
          name: Install Hypothesis Helm plugin
          environment:
            HH_PLUGIN_PATH: << parameters.plugin-path >>
          command: PYTHON=python3.13 helm plugin install "$HH_PLUGIN_PATH"
      - run:
          name: Prepare Kubernetes schemas before testing
          environment:
            HH_SCHEMA_OFFLINE: "<< parameters.schema-offline >>"
            HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: << parameters.schema-memory-dir >>
            HH_SCHEMA_VERSION: << parameters.schema-version >>
            HH_SCHEMA_CACHE_DIR: << parameters.schema-cache-dir >>
          command: |
            if [[ "$HH_SCHEMA_OFFLINE" == "true" ]]; then
              helm hypothesis schemas --schema-version "$HH_SCHEMA_VERSION" \
                --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" --schema-offline
            else
              helm hypothesis schemas --schema-version "$HH_SCHEMA_VERSION" \
                --schema-cache-dir "$HH_SCHEMA_CACHE_DIR"
            fi
      - save_cache:
          key: helm-schemas-v1-{{ arch }}-<< parameters.schema-version >>-{{ epoch }}-{{ .Environment.CIRCLE_NODE_INDEX }}
          paths:
            - << parameters.schema-cache-dir >>
      - test:
          defer-failure: true
          report-group: << parameters.report-group >>
          kubesec: << parameters.kubesec >>
          kubesec-jobs: << parameters.kubesec-jobs >>
          schema-memory-dir: << parameters.schema-memory-dir >>
          schema-version: << parameters.schema-version >>
          schema-cache-dir: << parameters.schema-cache-dir >>
          chart: << parameters.chart >>
          jobs: << parameters.jobs >>
          max-examples: << parameters.max-examples >>
          seed: << parameters.seed >>
          sample-random: << parameters.sample-random >>
          sample-min-cases: << parameters.sample-min-cases >>
          artifact-dir: << parameters.artifact-dir >>
      - run:
          name: Stage this shard for aggregation
          environment:
            HH_ARTIFACT_DIR: << parameters.artifact-dir >>
            HH_REPORT_GROUP: << parameters.report-group >>
          command: |
            shard_id="$((CIRCLE_NODE_INDEX + 1))-of-${CIRCLE_NODE_TOTAL}"
            destination="/tmp/hypothesis-helm-aggregation/${HH_REPORT_GROUP}/${shard_id}"
            mkdir -p "$destination"
            cp "$HH_ARTIFACT_DIR/shards/$shard_id/report.json" "$destination/report.json"
            cp "$HH_ARTIFACT_DIR/exit-code.txt" "$destination/exit-code.txt"
      - persist_to_workspace:
          root: /tmp/hypothesis-helm-aggregation
          paths:
            - << parameters.report-group >>
      - run:
          name: Preserve the test and validator exit status
          when: always
          environment:
            HH_ARTIFACT_DIR: << parameters.artifact-dir >>
          command: exit "$(cat "$HH_ARTIFACT_DIR/exit-code.txt")"
      - store_test_results:
          path: << parameters.artifact-dir >>
      - store_artifacts:
          path: << parameters.artifact-dir >>
  aggregate:
    description: Verify all shard reports and publish one final bundle, including after failures.
    parameters:
      shards:
        type: integer
      report-group:
        type: string
        default: chart
      package:
        type: string
        default: git+https://github.com/astrivant/hypothesis-helm.git@main
    docker:
      - image: cimg/python:3.13
    steps:
      - run:
          name: Install the matching Hypothesis Helm version
          environment:
            HH_PACKAGE: << parameters.package >>
          command: pip install "$HH_PACKAGE"
      - attach_workspace:
          at: /tmp/hypothesis-helm-aggregation
      - run:
          name: Write the final report
          environment:
            HH_REPORT_GROUP: << parameters.report-group >>
            HH_SHARDS: << parameters.shards >>
          command: |
            source_dir="/tmp/hypothesis-helm-aggregation/${HH_REPORT_GROUP}"
            aggregate_status=0
            cat "$source_dir"/*/report.json | hypothesis-helm aggregate \
              --shards "$HH_SHARDS" --run-id "${CIRCLE_WORKFLOW_ID}-${HH_REPORT_GROUP}" \
              --output-dir reports/final || aggregate_status=$?
            for status_file in "$source_dir"/*/exit-code.txt; do
              status="$(cat "$status_file")"
              if ((aggregate_status == 0 && status != 0)); then aggregate_status=$status; fi
            done
            exit "$aggregate_status"
      - store_test_results:
          path: reports/final
      - store_artifacts:
          path: reports/final
