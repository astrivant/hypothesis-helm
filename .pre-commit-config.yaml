default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts)/.*\.py$
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.6
    hooks:
      - id: pydoclint
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts)/.*\.py$
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: bash scripts/project-run.sh shfmt -w
        language: system
        types: [shell]
        files: ^(scripts/|ansible/|pkg/hypothesis_helm/(integrations|benchmarking)/)
      - id: ruff-check
        name: Ruff lint
        entry: bash scripts/project-run.sh ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: bash scripts/project-run.sh ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: bash scripts/project-run.sh mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: cli-reference
        name: Generated CLI and finding references
        entry: bash scripts/project-run.sh cog --check docs/cli/README.md docs/rules/README.md
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-contents
        name: Documentation tables of contents
        entry: bash scripts/project-run.sh hypothesis-helm-docs
        language: system
        types: [markdown]
