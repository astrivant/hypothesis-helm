name: Deploy stage

on:
  workflow_call:
    inputs:
      binary-cache:
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  HH_BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.binary-cache) }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish verified distributions to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Resolve release version
        id: package-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Set distribution version
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: poetry version "$PACKAGE_VERSION"
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [[ -z "$POETRY_PYPI_TOKEN_PYPI" ]]; then
              echo '::error::PYPI_API_TOKEN is unavailable. Grant this repository access to the organization secret, or set a repository/environment secret.'
              exit 1
          fi
          echo "Publishing hypothesis-helm $PACKAGE_VERSION to PyPI"
          poetry publish --no-interaction
