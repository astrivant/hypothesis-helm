name: Deploy stage

on:
  workflow_call:
    inputs:
      binary-cache:
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  HH_BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.binary-cache) }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish verified distributions to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require complete release signing configuration before PyPI publication
        env:
          SIGNING_KEY_CONFIGURED: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          SIGNING_PASSWORD_CONFIGURED: ${{ secrets.COSIGN_PASSWORD != '' }}
          SIGNING_FINGERPRINT_CONFIGURED: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 != '' }}
        run: |
          for configured in "$SIGNING_KEY_CONFIGURED" "$SIGNING_PASSWORD_CONFIGURED" "$SIGNING_FINGERPRINT_CONFIGURED"; do
              if [ "$configured" != true ]; then
                  echo '::error::Release signing is not configured. Run the documented setup-signing.sh helper before publishing.'
                  exit 1
              fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Resolve release version
        id: package-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Set distribution version
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: poetry version "$PACKAGE_VERSION"
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [[ -z "$POETRY_PYPI_TOKEN_PYPI" ]]; then
              echo '::error::PYPI_API_TOKEN is unavailable. Grant this repository access to the organization secret, or set a repository/environment secret.'
              exit 1
          fi
          echo "Publishing hypothesis-helm $PACKAGE_VERSION to PyPI"
          poetry publish --no-interaction --skip-existing

  github-release:
    name: Publish signed GitHub release
    needs: publish
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
          && needs.publish.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the version parser
        run: pip install packaging==26.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Resolve release version
        id: package-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Download this run's verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
      - name: Sign, verify and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
        run: bash scripts/release/publish.sh
