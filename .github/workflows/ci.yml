name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      refresh:
        description: Run benchmarks on main or a PR branch and commit updated graphs after verification
        type: boolean
        default: false
      bitnami-scan:
        description: Scan Bitnami charts at BITNAMI_REMOTE_REF (default HEAD) and commit reports to the selected branch
        type: boolean
        default: false
      prometheus-scan:
        description: Scan pinned Prometheus charts on eighty standard runners and commit reports to the selected branch
        type: boolean
        default: false
      pull-request:
        description: Open PR number for refresh on its head branch; leave empty when running on main
        type: string
        default: ''
      binary-cache:
        description: Reuse versioned binaries unless HH_BINARY_CACHE disables caching
        type: boolean
        default: true
      kubesec-score-minimum:
        description: Minimum Kubesec score (defaults to HH_KUBESEC_SCORE_MINIMUM or 0)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual refreshes and tag releases keep their work; newer PR commits supersede older checks.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent stages start together; grouping must not serialize expensive suites.
  test-stage:
    name: Test
    uses: ./.github/workflows/stage-test.yml
    permissions:
      contents: write
    with:
      binary-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.binary-cache }}
      kubesec-score-minimum: ${{ inputs.kubesec-score-minimum || '' }}

  build-stage:
    name: Build
    uses: ./.github/workflows/stage-build.yml
    with:
      binary-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.binary-cache }}

  verification:
    name: CI verification
    if: ${{ always() }}
    needs: [test-stage, build-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"

  measure-stage:
    name: Benchmark / refresh / scan
    needs: verification
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.bitnami-scan || inputs.prometheus-scan) }}
    uses: ./.github/workflows/stage-measure.yml
    permissions:
      contents: write
      pull-requests: read
      statuses: write
      actions: write
    secrets:
      BENCHMARK_PUBLISH_TOKEN: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
    with:
      binary-cache: ${{ inputs.binary-cache }}
      refresh: ${{ inputs.refresh }}
      bitnami-scan: ${{ inputs.bitnami-scan }}
      prometheus-scan: ${{ inputs.prometheus-scan }}
      pull-request: ${{ inputs.pull-request }}

  deploy-stage:
    name: Deploy
    needs: verification
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
          && needs.verification.result == 'success' }}
    uses: ./.github/workflows/stage-deploy.yml
    permissions:
      contents: write
    secrets: inherit

  release-verification:
    name: Release verification
    # Audit missing or skipped publication too; passing source checks is insufficient.
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verification, deploy-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful source checks and publication
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the version parser
        run: pip install packaging==26.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify public artifacts against the immutable source and trusted key
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          COSIGN_PUBLIC_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
        run: bash scripts/release/verify-published.sh
