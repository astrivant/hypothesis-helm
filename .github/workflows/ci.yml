name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      refresh:
        description: Run required PR benchmarks and commit updated graphs after verification
        type: boolean
        default: false
      pull-request:
        description: Open PR number for refresh; select its head branch as the workflow ref
        type: string
        default: ''
      binary-cache:
        description: Reuse versioned binaries unless HH_BINARY_CACHE disables caching
        type: boolean
        default: true
      kubesec-score-minimum:
        description: Minimum Kubesec score (defaults to HH_KUBESEC_SCORE_MINIMUM or 0)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual refreshes and tag releases keep their work; newer PR commits supersede older checks.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  HH_BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.binary-cache) }}

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: catalog extractors
            module: pkg/hypothesis_helm_catalog/upstream
          - component: Helm renderer
            module: pkg/hypothesis_helm/compiler/assets/renderer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test native Go code
        env:
          GO_MODULE: ${{ matrix.module }}
        run: go -C "$GO_MODULE" test -v -timeout 10m ./...

  checks:
    name: Lint and generated references
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Run every pre-commit hook
        run: bash scripts/project-run.sh pre-commit run --all-files --show-diff-on-failure

  python-tests:
    name: Python tests (${{ matrix.shard }}/4)
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Cache the pinned random-input renderer
        uses: actions/cache@v5
        with:
          path: .cache/random-renderer/
          key: hh-random-renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm/compiler/assets/renderer/*') }}
      - name: Build the random-input renderer for native integration tests
        run: bash scripts/project-run.sh hypothesis-helm-renderer --build
      - name: Run this test shard across available CPUs
        env:
          SUITE_SHARD: ${{ matrix.shard }}/4
          COVERAGE_FILE: .cache/tests/.coverage.${{ matrix.shard }}
        run: |
          bash scripts/project-run.sh pytest -p hypothesis_helm.tests.sharding --suite-shard "$SUITE_SHARD" \
              -n auto --dist worksteal --junitxml=.cache/tests/pytest.xml --cov --cov-config=pyproject.toml --cov-report=
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results-${{ matrix.shard }}
          path: .cache/tests/
          include-hidden-files: true
          retention-days: 30

  coverage:
    name: Combine Python coverage
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked coverage tools
        run: |
          pip install poetry==2.1.3
          poetry install --only dev --no-root --no-interaction
      - uses: actions/download-artifact@v8
        with:
          pattern: python-test-results-*
          path: .cache/coverage-shards/
      - name: Combine all four shards and export coverage
        run: |
          for shard in 1 2 3 4; do
              test -s ".cache/coverage-shards/python-test-results-${shard}/.coverage.${shard}"
          done
          poetry run coverage combine .cache/coverage-shards/python-test-results-*/.coverage.*
          poetry run coverage json -o coverage.json
          poetry run coverage html -d .cache/coverage-html
          poetry run coverage report >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            coverage.json
            .cache/coverage-html/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  coverage-badge:
    name: Publish coverage badge
    needs: coverage
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      # The badge action embeds checkout@v3, which cannot remove v6+ includeIf credentials.
      # Keep both checkouts on the direct-header format to avoid duplicate Authorization headers.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: python-coverage
      - name: Check whether the badge percentage changed
        id: badge
        run: |
          previous="$RUNNER_TEMP/previous-coverage.svg"
          if [[ -n "$(git ls-remote --heads origin refs/heads/gh-pages)" ]]; then
              git fetch origin gh-pages
              git show FETCH_HEAD:badges/coverage.svg >"$previous" || truncate -s 0 "$previous"
          else
              touch "$previous"
          fi
          python - "$previous" >>"$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          percent = str(json.loads(Path("coverage.json").read_text())["totals"]["percent_covered_display"])
          previous = Path(sys.argv[1]).read_text()
          labels = set(ElementTree.fromstring(previous).itertext()) if previous else set()
          print(f"changed={str(f'{percent}%' not in labels).lower()}")
          PY
      # v1.0.1 predates coverage.py support; pin the Python-capable action revision.
      - uses: we-cli/coverage-badge-action@8a0b6ee05f6dd0f294089cbe7a848452a2b43eef
        if: steps.badge.outputs.changed == 'true'

  sharded-chart:
    name: "Chart tests and Kubesec (Kubernetes ${{ matrix.kubernetes }}, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        kubernetes: ['1.34.0', '1.35.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Restore chart outcomes and manifests
        id: outcomes
        uses: actions/cache/restore@v5
        with:
          path: .cache/hypothesis-helm/outcomes
          key: chart-outcomes-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.kubernetes }}-${{ matrix.shard }}-of-3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chart-outcomes-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.kubernetes }}-${{ matrix.shard }}-of-3-
      - uses: ./
        id: hypothesis
        with:
          chart: examples/workload
          binary-cache: ${{ env.HH_BINARY_CACHE }}
          incremental: 'true'
          cache-dir: .cache/hypothesis-helm/outcomes
          rerun: ${{ startsWith(github.ref, 'refs/tags/') && 'all' || 'auto' }}
          command: test
          traversal-strategy: random
          config-inline: |
            hypothesis:
              max_examples: 5
              control_characters:
                allow: []
          schema-validation: 'true'
          schema-version: ${{ matrix.kubernetes }}
          kubesec: 'true'
          kubesec-jobs: auto
          kubesec-score-minimum: ${{ inputs.kubesec-score-minimum || vars.HH_KUBESEC_SCORE_MINIMUM || '0' }}
          artifact-name: hypothesis-helm-${{ matrix.kubernetes }}
          schema-cache-dir: schemas
          job-index: ${{ matrix.shard }}
          job-total: '3'
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kubernetes }}
      - name: Save chart outcomes and manifests
        if: ${{ always() && steps.outcomes.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/hypothesis-helm/outcomes
          key: ${{ steps.outcomes.outputs.cache-primary-key }}
      - name: Check shard outputs
        shell: bash
        env:
          REPORT: ${{ steps.hypothesis.outputs.junit-path }}
          MANIFESTS: ${{ steps.hypothesis.outputs.manifest-path }}
        run: |
          test -f "$REPORT"
          test -f "$MANIFESTS"
  aggregate:
    name: "Combine shard reports (Kubernetes ${{ matrix.kubernetes }})"
    needs: sharded-chart
    if: ${{ always() && needs.sharded-chart.result != 'skipped' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ['1.34.0', '1.35.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - uses: actions/download-artifact@v8
        with:
          pattern: hypothesis-helm-${{ matrix.kubernetes }}-sharded-chart-*
          path: downloaded
      - uses: actions/download-artifact@v8
        if: ${{ always() }}
        with:
          pattern: hypothesis-helm-${{ matrix.kubernetes }}-kubesec-sharded-chart-*
          path: downloaded-security
      - name: Write final report for this Kubernetes version
        if: ${{ always() }}
        env:
          HH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kubernetes }}
          HH_KUBESEC: 'true'
          HH_SCHEMA_VERSION: ${{ matrix.kubernetes }}
          HH_KUBESEC_SCORE_MINIMUM: ${{ inputs.kubesec-score-minimum || vars.HH_KUBESEC_SCORE_MINIMUM || '0' }}
        run: |
          aggregate_status=0
          cat downloaded/*/report.json | hypothesis-helm aggregate \
              --shards 3 --run-id "$HH_RUN_ID" --output-dir docs/reports/final || aggregate_status=$?
          if [[ "${HH_KUBESEC:-false}" == "true" ]]; then
              security_status=0
              hypothesis-helm-kubesec downloaded-security --aggregate --shards 3 \
                  --run-id "$HH_RUN_ID" --schema-version "$HH_SCHEMA_VERSION" \
                  --score-minimum "$HH_KUBESEC_SCORE_MINIMUM" \
                  --output docs/reports/final/kubesec || security_status=$?
              if ((aggregate_status == 0)); then
                  aggregate_status=$security_status
              fi
          fi
          exit "$aggregate_status"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: hypothesis-helm-final-${{ matrix.kubernetes }}
          path: docs/reports/final/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build distributions and test Helm commands
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Resolve package version before building
        id: package-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
              python .github/release-version.py --tag "$REF_NAME" --output "$GITHUB_OUTPUT"
          else
              python .github/release-version.py --output "$GITHUB_OUTPUT"
          fi
      - name: Set distribution version
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: poetry version "$PACKAGE_VERSION"
      - name: Cache catalog rebuild sources
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v5
        with:
          path: schemas/
          key: catalog-v1-${{ runner.os }}-${{ runner.arch }}-1.35.0-${{ hashFiles('pkg/hypothesis_helm_catalog/data/kubernetes-source-lock.json', 'pkg/hypothesis_helm_catalog/upstream/go.sum') }}
      - name: Verify bundled input domains before a release
        if: startsWith(github.ref, 'refs/tags/')
        run: poetry run hypothesis-helm-catalog --check
      - name: Cache pinned compiler sources
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v5
        with:
          path: .cache/compiler-builtins/
          key: compiler-builtins-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm_catalog/data/builtin-sources.json', 'pkg/hypothesis_helm_catalog/upstream/go.sum') }}
      - name: Verify compiler function inventory before a release
        if: startsWith(github.ref, 'refs/tags/')
        run: poetry run hypothesis-helm-builtins --check
      - name: Build wheel and source distribution
        run: poetry build
      - name: Verify end-user Helm testing commands
        run: |
          PYTHON=python3.13 helm plugin install .
          helm hypothesis test examples/workload --max-examples 5
          helm hypothesis run examples/generated-workload
          helm hypothesis generate examples/workload --output "$RUNNER_TEMP/generated-workload" --max-examples 5
          helm hypothesis run "$RUNNER_TEMP/generated-workload"
      - name: Upload distributions
        if: ${{ always() && steps.package-version.outputs.version != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
          retention-days: 30

  smoke:
    name: Check benchmark recipes and plot generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Exercise benchmark recipes and plots
        run: bash scripts/project-run.sh hypothesis-helm-benchmark smoke
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-smoke
          path: .cache/benchmarks/smoke/
          include-hidden-files: true
          retention-days: 30

  verification:
    name: CI verification
    if: ${{ always() }}
    needs: [go, checks, python-tests, sharded-chart, aggregate, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"

  pr-benchmark-request:
    name: Validate manual PR benchmark request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the current head of an open PR
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/pr-benchmarks.sh validate

  refresh-prepare:
    name: Prepare shared inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
    needs: [verification, pr-benchmark-request]
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      root: ${{ steps.prepare.outputs.root }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Cache pinned sources and native builds
        uses: actions/cache@v5
        with:
          path: |
            schemas/
            .cache/compiler-builtins/
            .cache/random-renderer/
          key: refresh-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm_catalog/data/*.json', 'pkg/hypothesis_helm_catalog/builder.py', 'pkg/hypothesis_helm_catalog/sources.py', 'pkg/hypothesis_helm_catalog/upstream/*', 'pkg/hypothesis_helm/compiler/assets/renderer/*') }}
      - name: Check project and prepare shared inputs
        id: prepare
        run: poetry run hypothesis-helm-refresh --ci-phase prepare
      - name: Package prepared workspace
        env:
          ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          tar -czf "$RUNNER_TEMP/refresh-prepared.tar.gz" "$ROOT" \
              pkg/hypothesis_helm/compiler/assets/builtin_inventory.json \
              pkg/hypothesis_helm_catalog/data/input-domains.json \
              README.md docs/cli/README.md docs/rules/README.md \
              docs/input-domains/README.md docs/compiler/functions.md
      - uses: actions/upload-artifact@v7
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-prepared.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: refresh-prepare-diagnostics
          path: .cache/refresh/
          include-hidden-files: true
          retention-days: 30
  refresh-study:
    name: "Study: ${{ matrix.study }}"
    needs: refresh-prepare
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # No max-parallel cap: GitHub schedules as many jobs as capacity permits.
      matrix: ${{ fromJSON(needs.refresh-prepare.outputs.matrix) }}
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
      STUDY: ${{ matrix.study }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - name: Restore common source snapshot and inputs
        run: tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
      - name: Run isolated study
        run: poetry run hypothesis-helm-refresh --ci-phase study --root "$ROOT" --study "$STUDY"
      - name: Package study outputs and journal
        if: ${{ always() }}
        run: |
          mkdir -p "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
          tar -czf "$RUNNER_TEMP/refresh-study-$STUDY.tar.gz" \
              "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-study-${{ matrix.study }}
          path: ${{ runner.temp }}/refresh-study-${{ matrix.study }}.tar.gz
          retention-days: 30
  refresh-error-surface:
    name: "Error surface (${{ matrix.shard }}/8)"
    needs: refresh-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - name: Restore prepared inputs
        run: tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
      - name: Measure paired error-surface shard
        run: |
          set -o pipefail
          mkdir -p "$ROOT/error-surface-shards/$SHARD"
          poetry run hypothesis-helm-benchmark error-surface --output-size 11x13 --time-limit 9m \
              --shard-index "$SHARD" --shard-count 8 --output "$ROOT/error-surface-shards/$SHARD" \
              2>&1 | tee "$ROOT/error-surface-shards/$SHARD/run.log"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-error-surface-${{ matrix.shard }}
          path: ${{ env.ROOT }}/error-surface-shards/${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 30
  refresh-error-surface-merge:
    name: Verify and plot error surface
    needs: [refresh-prepare, refresh-error-surface]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - uses: actions/download-artifact@v8
        with:
          pattern: refresh-error-surface-*
          path: ${{ runner.temp }}/error-surface-shards
      - name: Merge verified measurements and generate plots
        run: |
          tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
          poetry run hypothesis-helm-benchmark error-surface \
              --merge-shards "$RUNNER_TEMP"/error-surface-shards/*/results.json \
              --output "$ROOT/outputs/error-surface"
          python "$ROOT/verify-measurements.py" "$ROOT" --study error-surface
          mkdir -p "$ROOT/statuses"
          printf 'error-surface\t0\n' >"$ROOT/statuses/error-surface.tsv"
          tar -czf "$RUNNER_TEMP/refresh-study-error-surface.tar.gz" \
              "$ROOT/outputs/error-surface" "$ROOT/statuses/error-surface.tsv"
      - uses: actions/upload-artifact@v7
        with:
          name: refresh-study-error-surface
          path: ${{ runner.temp }}/refresh-study-error-surface.tar.gz
          retention-days: 30
  refresh-stress:
    name: "Stress progression (${{ matrix.shard }}/6)"
    needs: refresh-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - name: Restore prepared inputs
        run: tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
      - name: Measure paired stress shard
        run: |
          set -o pipefail
          mkdir -p "$ROOT/stress-shards/$SHARD"
          poetry run hypothesis-helm-benchmark stress --time-limit 9m \
              --shard-index "$SHARD" --shard-count 6 --output "$ROOT/stress-shards/$SHARD" \
              2>&1 | tee "$ROOT/stress-shards/$SHARD/run.log"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-stress-${{ matrix.shard }}
          path: ${{ env.ROOT }}/stress-shards/${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 30
  refresh-stress-merge:
    name: Verify and plot stress progression
    needs: [refresh-prepare, refresh-stress]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - uses: actions/download-artifact@v8
        with:
          pattern: refresh-stress-*
          path: ${{ runner.temp }}/stress-shards
      - name: Merge verified measurements and generate plots
        run: |
          tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
          poetry run hypothesis-helm-benchmark stress \
              --merge-shards "$RUNNER_TEMP"/stress-shards/*/results.json \
              --output "$ROOT/outputs/stress"
          python "$ROOT/verify-measurements.py" "$ROOT" --study stress
          mkdir -p "$ROOT/statuses"
          printf 'stress\t0\n' >"$ROOT/statuses/stress.tsv"
          tar -czf "$RUNNER_TEMP/refresh-study-stress.tar.gz" \
              "$ROOT/outputs/stress" "$ROOT/statuses/stress.tsv"
      - uses: actions/upload-artifact@v7
        with:
          name: refresh-study-stress
          path: ${{ runner.temp }}/refresh-study-stress.tar.gz
          retention-days: 30
  refresh-finish:
    name: Verify and commit PR benchmark graphs
    needs: [pr-benchmark-request, refresh-prepare, refresh-study, refresh-error-surface-merge, refresh-stress-merge]
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: read
      actions: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Restore pinned chart repositories
        run: git submodule update --init --recursive
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - uses: actions/download-artifact@v8
        with:
          pattern: refresh-study-*
          merge-multiple: true
          path: ${{ runner.temp }}/refresh-studies
      - name: Restore all completed study artifacts
        run: |
          tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
          for archive in "$RUNNER_TEMP"/refresh-studies/*.tar.gz; do
              tar -xzf "$archive"
          done
      - name: Verify measurements and publish diagrams
        run: poetry run hypothesis-helm-refresh --ci-phase graphs --root "$ROOT"
      - name: Commit verified graphs and start checks on the new commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BASE_SHA: ${{ needs.pr-benchmark-request.outputs.base_sha }}
        run: bash .github/pr-benchmarks.sh commit
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-refresh
          path: |
            pkg/hypothesis_helm/compiler/assets/builtin_inventory.json
            pkg/hypothesis_helm_catalog/data/input-domains.json
            pkg/hypothesis_helm_benchmarking/assets/fixture/parameters/
            README.md
            docs/cli/README.md
            docs/rules/README.md
            docs/input-domains/README.md
            docs/compiler/functions.md
            docs/benchmarking/
            docs/reports/
            studies/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-resume-data
          path: ${{ env.ROOT }}
          include-hidden-files: true
          retention-days: 30

  pr-benchmark-result:
    name: Record PR benchmark result
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.refresh && needs.pr-benchmark-request.outputs.sha != '' }}
    needs: [pr-benchmark-request, refresh-finish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Attach required status to the resulting PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.refresh-finish.result }}
          RESULT_SHA: ${{ needs.refresh-finish.outputs.sha || needs.pr-benchmark-request.outputs.sha }}
        run: |
          state=failure
          description='Benchmarks failed, were cancelled, or became stale; inspect the manual run'
          if [[ "$RESULT" == success ]]; then
              state=success
              description='Manual benchmarks passed; graphs are committed on this PR head'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$RESULT_SHA" \
              -f state="$state" -f context='PR benchmark results' -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    name: Publish verified distributions to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [go, checks, python-tests, sharded-chart, aggregate, build, smoke]
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Resolve release version
        id: package-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Set distribution version
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: poetry version "$PACKAGE_VERSION"
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [[ -z "$POETRY_PYPI_TOKEN_PYPI" ]]; then
              echo '::error::PYPI_API_TOKEN is unavailable. Grant this repository access to the organization secret, or set a repository/environment secret.'
              exit 1
          fi
          echo "Publishing hypothesis-helm $PACKAGE_VERSION to PyPI"
          poetry publish --no-interaction
