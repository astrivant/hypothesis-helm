name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'push' || inputs.binary-cache) }}

defaults:
  run:
    shell: bash

jobs:
  test-python:
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 30
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          pip install poetry==2.1.3 pre-commit==4.6.0
          poetry install --extras benchmarking
      - name: Verify package version before building
        id: package-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(poetry version --short)"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must be v$version to match pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building and testing hypothesis-helm $version"
      - name: Install GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: Restore Helm binary
        id: helm-cache
        if: ${{ env.BINARY_CACHE == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ env.HELM_VERSION }}-linux-amd64
          key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ env.HELM_VERSION }}-exact
      - name: Install Helm for chart integration tests
        run: |
          platform=linux
          architecture=amd64
          binary_root="$RUNNER_TEMP/hypothesis-helm-binaries"
          if [[ "$BINARY_CACHE" != "true" ]]; then binary_root="$(mktemp -d)"; fi
          binary_dir="$binary_root/helm-${HELM_VERSION}-${platform}-${architecture}"
          if [[ ! -x "$binary_dir/helm" ]]; then
            download_dir="$(mktemp -d)"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-${platform}-${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
            tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" "${platform}-${architecture}/helm"
            mkdir -p "$binary_dir"
            install "$download_dir/${platform}-${architecture}/helm" "$binary_dir/helm.pending"
            mv "$binary_dir/helm.pending" "$binary_dir/helm"
            rm -rf "$download_dir"
          fi
          echo "$binary_dir" >> "$GITHUB_PATH"
      - name: Save Helm binary
        if: ${{ env.BINARY_CACHE == 'true' && steps.helm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ env.HELM_VERSION }}-linux-amd64
          key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ env.HELM_VERSION }}-exact
      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run framework checks and parallel tests
        run: bash scripts/check.sh --junitxml=reports/pytest.xml
      - name: Exercise the shared benchmark chart and stress plots
        run: bash benchmarks/smoke.sh
      - name: Build wheel and source distribution
        run: poetry build
      - name: Verify end-user Helm testing commands
        run: |
          PYTHON=python3.13 helm plugin install .
          helm hypothesis test examples/workload --max-examples 5
          helm hypothesis run examples/generated-workload
          helm hypothesis generate examples/workload --output "$RUNNER_TEMP/generated-workload" --max-examples 5
          helm hypothesis run "$RUNNER_TEMP/generated-workload"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: reports/
          retention-days: 30
      - name: Upload distributions
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
          retention-days: 30
      - name: Upload benchmark smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-benchmark-smoke
          path: benchmarks/runs/smoke/
          retention-days: 30
