name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      refresh:
        description: Run required PR benchmarks and commit updated graphs after verification
        type: boolean
        default: false
      bitnami-scan:
        description: Scan pinned Bitnami charts on 14 runners; commit reports only when run on main
        type: boolean
        default: false
      prometheus-scan:
        description: Scan pinned Prometheus charts on 14 runners; commit reports only when run on main
        type: boolean
        default: false
      pull-request:
        description: Open PR number for refresh; select its head branch as the workflow ref
        type: string
        default: ''
      binary-cache:
        description: Reuse versioned binaries unless HH_BINARY_CACHE disables caching
        type: boolean
        default: true
      kubesec-score-minimum:
        description: Minimum Kubesec score (defaults to HH_KUBESEC_SCORE_MINIMUM or 0)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual refreshes and tag releases keep their work; newer PR commits supersede older checks.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent stages start together; grouping must not serialize expensive suites.
  test-stage:
    name: Test
    uses: ./.github/workflows/stage-test.yml
    permissions:
      contents: write
    with:
      binary-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.binary-cache }}
      kubesec-score-minimum: ${{ inputs.kubesec-score-minimum || '' }}

  build-stage:
    name: Build
    uses: ./.github/workflows/stage-build.yml
    with:
      binary-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.binary-cache }}

  verification:
    name: CI verification
    if: ${{ always() }}
    needs: [test-stage, build-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"

  measure-stage:
    name: Benchmark / refresh / scan
    needs: verification
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.bitnami-scan || inputs.prometheus-scan) }}
    uses: ./.github/workflows/stage-measure.yml
    permissions:
      contents: write
      pull-requests: read
      statuses: write
      actions: write
    with:
      binary-cache: ${{ inputs.binary-cache }}
      refresh: ${{ inputs.refresh }}
      bitnami-scan: ${{ inputs.bitnami-scan }}
      prometheus-scan: ${{ inputs.prometheus-scan }}
      pull-request: ${{ inputs.pull-request }}

  deploy-stage:
    name: Deploy
    needs: verification
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/stage-deploy.yml
    secrets: inherit
