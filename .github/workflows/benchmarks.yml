name: Benchmarks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-refresh:
        description: Run all benchmarks, topology exports, and Bitnami/Prometheus tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install poetry==2.1.3
      - run: poetry install --extras benchmarking
      - name: Install Helm 4
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: bash benchmarks/smoke.sh
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-smoke
          path: benchmarks/runs/smoke/
          retention-days: 30
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-refresh }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install poetry==2.1.3
      - run: poetry install --extras benchmarking
      - name: Install Helm 4 and GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Refresh all measurements and reports
        run: |
          git config --global url."https://github.com/".insteadOf 'git@github.com:'
          poetry run bash benchmarks/refresh.sh
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-refresh
          path: |
            benchmarks/
            docs/reports/
            benchmarks/runs/refresh-*/logs/
            benchmarks/runs/refresh-*/status.tsv
            benchmarks/runs/refresh-*/current.txt
            benchmarks/runs/refresh-*/postprocess-current.txt
          include-hidden-files: true
          retention-days: 30
