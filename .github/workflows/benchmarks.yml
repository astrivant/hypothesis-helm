name: Benchmarks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-refresh:
        description: Run all benchmarks, topology exports, and Bitnami/Prometheus tests
        type: boolean
        default: false
env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install poetry==2.1.3
      - run: poetry install --extras benchmarking
      - name: Restore Helm binary
        id: helm-cache
        if: ${{ vars.HH_BINARY_CACHE != 'false' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ env.HELM_VERSION }}-linux-amd64
          key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ env.HELM_VERSION }}-exact
      - name: Install Helm 4
        env:
          BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' }}
        run: |
          platform=linux
          architecture=amd64
          binary_root="$RUNNER_TEMP/hypothesis-helm-binaries"
          if [[ "$BINARY_CACHE" != "true" ]]; then binary_root="$(mktemp -d)"; fi
          binary_dir="$binary_root/helm-${HELM_VERSION}-${platform}-${architecture}"
          if [[ ! -x "$binary_dir/helm" ]]; then
            download_dir="$(mktemp -d)"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-${platform}-${architecture}.tar.gz" -o "$download_dir/archive.tar.gz"
            tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" "${platform}-${architecture}/helm"
            mkdir -p "$binary_dir"
            install "$download_dir/${platform}-${architecture}/helm" "$binary_dir/helm.pending"
            mv "$binary_dir/helm.pending" "$binary_dir/helm"
            rm -rf "$download_dir"
          fi
          echo "$binary_dir" >> "$GITHUB_PATH"
      - name: Save Helm binary
        if: ${{ vars.HH_BINARY_CACHE != 'false' && steps.helm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hypothesis-helm-binaries/helm-${{ env.HELM_VERSION }}-linux-amd64
          key: hh-binary-v1-${{ runner.os }}-${{ runner.arch }}-helm-${{ env.HELM_VERSION }}-exact
      - run: bash scripts/project-run.sh hypothesis-helm-benchmark smoke
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-smoke
          path: .cache/benchmarks/smoke/
          include-hidden-files: true
          retention-days: 30
  refresh-prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-refresh }}
    needs: smoke
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 60
    outputs:
      root: ${{ steps.prepare.outputs.root }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/refresh-setup
      - name: Check project and prepare shared inputs
        id: prepare
        run: poetry run hypothesis-helm-refresh --ci-phase prepare
      - name: Package prepared workspace
        env:
          ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          stamp="${ROOT##*-}"
          tar -czf "$RUNNER_TEMP/refresh-prepared.tar.gz" "$ROOT" \
            "docs/reports/bitnami-runs/bitnami-charts_$stamp" \
            "docs/reports/prometheus-runs/prometheus-charts_$stamp"
      - uses: actions/upload-artifact@v7
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-prepared.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: refresh-prepare-diagnostics
          path: .cache/refresh/
          include-hidden-files: true
          retention-days: 30
  refresh-study:
    needs: refresh-prepare
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # No max-parallel cap: GitHub schedules as many jobs as capacity permits.
      matrix: ${{ fromJSON(needs.refresh-prepare.outputs.matrix) }}
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
      STUDY: ${{ matrix.study }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/refresh-setup
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - name: Restore common source snapshot and inputs
        run: tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
      - name: Run isolated study
        run: poetry run hypothesis-helm-refresh --ci-phase study --root "$ROOT" --study "$STUDY"
      - name: Package study outputs and journal
        if: ${{ always() }}
        run: |
          mkdir -p "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
          tar -czf "$RUNNER_TEMP/refresh-study-$STUDY.tar.gz" \
            "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-study-${{ matrix.study }}
          path: ${{ runner.temp }}/refresh-study-${{ matrix.study }}.tar.gz
          retention-days: 30
  refresh-finish:
    needs: [refresh-prepare, refresh-study]
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 360
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/refresh-setup
      - name: Restore pinned chart repositories
        run: git submodule update --init --recursive
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - uses: actions/download-artifact@v8
        with:
          pattern: refresh-study-*
          merge-multiple: true
          path: ${{ runner.temp }}/refresh-studies
      - name: Restore all completed study artifacts
        run: |
          tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
          for archive in "$RUNNER_TEMP"/refresh-studies/*.tar.gz; do
            tar -xzf "$archive"
          done
      - name: Verify measurements, publish diagrams, then test chart repositories
        run: poetry run hypothesis-helm-refresh --ci-phase finish --root "$ROOT"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-refresh
          path: |
            studies/
            pkg/hypothesis_helm/benchmarking/assets/fixture/parameters/
            docs/benchmarking/
            docs/reports/
            .cache/refresh/refresh-*/logs/
            .cache/refresh/refresh-*/ci-jobs/
            .cache/refresh/refresh-*/status.tsv
            .cache/refresh/refresh-*/operations.json
          include-hidden-files: true
          retention-days: 30
