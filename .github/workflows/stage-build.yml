name: Build stage

on:
  workflow_call:
    inputs:
      binary-cache:
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  HH_BINARY_CACHE: ${{ vars.HH_BINARY_CACHE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.binary-cache) }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build distributions and test Helm commands
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ env.HH_BINARY_CACHE }}
      - name: Resolve package version before building
        id: package-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
              python .github/release-version.py --tag "$REF_NAME" --output "$GITHUB_OUTPUT"
          else
              python .github/release-version.py --output "$GITHUB_OUTPUT"
          fi
      - name: Set distribution version
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: poetry version "$PACKAGE_VERSION"
      - name: Cache catalog rebuild sources
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v5
        with:
          path: schemas/
          key: catalog-v1-${{ runner.os }}-${{ runner.arch }}-1.35.0-${{ hashFiles('pkg/hypothesis_helm_catalog/data/kubernetes-source-lock.json', 'pkg/hypothesis_helm_catalog/upstream/go.sum') }}
      - name: Verify bundled input domains before a release
        if: startsWith(github.ref, 'refs/tags/')
        run: poetry run hypothesis-helm-catalog --check
      - name: Cache pinned compiler sources
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v5
        with:
          path: .cache/compiler-builtins/
          key: compiler-builtins-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm_catalog/data/builtin-sources.json', 'pkg/hypothesis_helm_catalog/upstream/go.sum') }}
      - name: Verify compiler function inventory before a release
        if: startsWith(github.ref, 'refs/tags/')
        run: poetry run hypothesis-helm-builtins --check
      - name: Build wheel and source distribution
        run: poetry build
      - name: Verify end-user Helm testing commands
        run: |
          PYTHON=python3.13 helm plugin install .
          helm hypothesis test examples/workload --max-examples 5
          helm hypothesis run examples/generated-workload
          helm hypothesis generate examples/workload --output "$RUNNER_TEMP/generated-workload" --max-examples 5
          helm hypothesis run "$RUNNER_TEMP/generated-workload"
      - name: Upload distributions
        if: ${{ always() && steps.package-version.outputs.version != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ steps.package-version.outputs.version }}
          path: dist/
          retention-days: 30
