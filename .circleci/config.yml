version: 2.1

# Reference only: this inline orb is intentionally absent from all workflows.
orbs:
  hypothesis-helm:
    commands:
      test:
        description: Test chart values with an installed Helm plugin and automatic CI sharding.
        parameters:
          chart:
            type: string
            default: examples/workload
          jobs:
            type: string
            default: auto
          max-examples:
            type: integer
            default: 100
          seed:
            type: integer
            default: 0
          schema-version:
            type: string
            default: latest
          kubesec:
            type: boolean
            default: false
          kubesec-jobs:
            type: string
            default: auto
          schema-memory-dir:
            type: string
            default: ""
          schema-offline:
            type: boolean
            default: false
          schema-cache-dir:
            type: string
            default: .cache/hypothesis-helm/schemas
          artifact-dir:
            type: string
            default: reports/hypothesis-helm
        steps:
          - run:
              name: Test Helm chart values
              environment:
                HH_KUBESEC: "<< parameters.kubesec >>"
                HH_KUBESEC_JOBS: << parameters.kubesec-jobs >>
                HH_SCHEMA_OFFLINE: "<< parameters.schema-offline >>"
                HH_CHART: << parameters.chart >>
                HH_JOBS: << parameters.jobs >>
                HH_MAX_EXAMPLES: << parameters.max-examples >>
                HH_SEED: << parameters.seed >>
                HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: << parameters.schema-memory-dir >>
                HH_SCHEMA_VERSION: << parameters.schema-version >>
                HH_SCHEMA_CACHE_DIR: << parameters.schema-cache-dir >>
                HH_ARTIFACT_DIR: << parameters.artifact-dir >>
              command: |
                mkdir -p "$HH_ARTIFACT_DIR"
                schema_options=()
                if [[ "$HH_SCHEMA_OFFLINE" == "true" ]]; then schema_options+=(--schema-offline); fi
                validation_options=(--kubeconform)
                if [[ "$HH_KUBESEC" == "true" ]]; then validation_options=(); fi
                test_status=0
                helm hypothesis test "$HH_CHART" \
                  --jobs "$HH_JOBS" \
                  --max-examples "$HH_MAX_EXAMPLES" \
                  --seed "$HH_SEED" \
                  "${validation_options[@]}" \
                  --schema-version "$HH_SCHEMA_VERSION" \
                  --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" "${schema_options[@]}" \
                  --shard auto \
                  --rerun all \
                  --artifact-dir "$HH_ARTIFACT_DIR" \
                  --output json > "$HH_ARTIFACT_DIR/manifests-${CIRCLE_NODE_INDEX:-0}.jsonl" || test_status=$?
                if [[ "$HH_KUBESEC" == "true" ]]; then
                  plugin_python="$(helm env HELM_PLUGINS)/hypothesis/.plugin-venv/bin/python"
                  scan_status=0
                  "$plugin_python" -m hypothesis_helm.integrations.kubesec \
                    "$HH_ARTIFACT_DIR/manifests-${CIRCLE_NODE_INDEX:-0}.jsonl" \
                    --output "$HH_ARTIFACT_DIR/kubesec" --jobs "$HH_KUBESEC_JOBS" \
                    --shard auto --pre-sharded --validate-rest --schema-version "$HH_SCHEMA_VERSION" \
                    --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" "${schema_options[@]}" || scan_status=$?
                  if ((test_status == 0)); then test_status=$scan_status; fi
                fi
                exit "$test_status"
    jobs:
      test-chart:
        description: Install the local plugin and test a chart; reference job, not scheduled.
        parameters:
          chart:
            type: string
            default: examples/workload
          plugin-path:
            type: string
            default: .
          kubesec-version:
            type: string
            default: v2.14.2
          kubeconform-version:
            type: string
            default: v0.7.0
          helm-version:
            type: string
            default: v3.19.0
          parallelism:
            type: integer
            default: 1
          jobs:
            type: string
            default: auto
          max-examples:
            type: integer
            default: 100
          seed:
            type: integer
            default: 0
          schema-version:
            type: string
            default: latest
          kubesec:
            type: boolean
            default: false
          kubesec-jobs:
            type: string
            default: auto
          schema-memory-dir:
            type: string
            default: ""
          schema-offline:
            type: boolean
            default: false
          schema-cache-dir:
            type: string
            default: .cache/hypothesis-helm/schemas
          artifact-dir:
            type: string
            default: reports/hypothesis-helm
        docker:
          - image: cimg/python:3.13
        parallelism: << parameters.parallelism >>
        steps:
          - checkout
          - restore_cache:
              keys:
                - helm-schemas-v1-{{ arch }}-<< parameters.schema-version >>-
          - run:
              name: Install Helm and the local Hypothesis plugin
              environment:
                HH_KUBESEC: "<< parameters.kubesec >>"
                HH_KUBESEC_VERSION: << parameters.kubesec-version >>
                HH_KUBECONFORM_VERSION: << parameters.kubeconform-version >>
                HH_HELM_VERSION: << parameters.helm-version >>
                HH_PLUGIN_PATH: << parameters.plugin-path >>
              command: |
                install_dir="$(mktemp -d)"
                curl -fsSL "https://get.helm.sh/helm-${HH_HELM_VERSION}-linux-amd64.tar.gz" \
                  -o "$install_dir/helm.tar.gz"
                tar -xzf "$install_dir/helm.tar.gz" -C "$install_dir"
                sudo install "$install_dir/linux-amd64/helm" /usr/local/bin/helm
                curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${HH_KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
                  -o "$install_dir/kubeconform.tar.gz"
                tar -xzf "$install_dir/kubeconform.tar.gz" -C "$install_dir" kubeconform
                sudo install "$install_dir/kubeconform" /usr/local/bin/kubeconform
                if [[ "$HH_KUBESEC" == "true" ]]; then
                  sudo apt-get update
                  sudo apt-get install -y parallel
                  curl -fsSL "https://github.com/controlplaneio/kubesec/releases/download/${HH_KUBESEC_VERSION}/kubesec_linux_amd64.tar.gz" \
                    -o "$install_dir/kubesec.tar.gz"
                  tar -xzf "$install_dir/kubesec.tar.gz" -C "$install_dir" kubesec
                  sudo install "$install_dir/kubesec" /usr/local/bin/kubesec
                fi
                PYTHON=python3.13 helm plugin install "$HH_PLUGIN_PATH"
          - run:
              name: Prepare Kubernetes schemas before testing
              environment:
                HH_SCHEMA_OFFLINE: "<< parameters.schema-offline >>"
                HYPOTHESIS_HELM_SCHEMA_MEMORY_DIR: << parameters.schema-memory-dir >>
                HH_SCHEMA_VERSION: << parameters.schema-version >>
                HH_SCHEMA_CACHE_DIR: << parameters.schema-cache-dir >>
              command: |
                schema_options=()
                if [[ "$HH_SCHEMA_OFFLINE" == "true" ]]; then schema_options+=(--schema-offline); fi
                helm hypothesis schemas --schema-version "$HH_SCHEMA_VERSION" \
                  --schema-cache-dir "$HH_SCHEMA_CACHE_DIR" "${schema_options[@]}"
          - save_cache:
              key: helm-schemas-v1-{{ arch }}-<< parameters.schema-version >>-{{ epoch }}-{{ .Environment.CIRCLE_NODE_INDEX }}
              paths:
                - << parameters.schema-cache-dir >>
          - test:
              kubesec: << parameters.kubesec >>
              kubesec-jobs: << parameters.kubesec-jobs >>
              schema-memory-dir: << parameters.schema-memory-dir >>
              schema-offline: true
              schema-version: << parameters.schema-version >>
              schema-cache-dir: << parameters.schema-cache-dir >>
              chart: << parameters.chart >>
              jobs: << parameters.jobs >>
              max-examples: << parameters.max-examples >>
              seed: << parameters.seed >>
              artifact-dir: << parameters.artifact-dir >>
          - store_test_results:
              path: << parameters.artifact-dir >>
          - store_artifacts:
              path: << parameters.artifact-dir >>

jobs:
  test-python:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run: pip install poetry==2.1.3 pre-commit==4.6.0
      - run: poetry install
      - run: sudo apt-get update && sudo apt-get install -y parallel
      - run:
          name: Install Helm for chart integration tests
          command: |
            curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
            tar -xzf /tmp/helm.tar.gz -C /tmp
            sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: bash scripts/check.sh --junitxml=reports/pytest.xml
      - run: poetry build
      - run:
          name: Verify end-user Helm testing commands
          command: |
            PYTHON=python3.13 helm plugin install .
            helm hypothesis test examples/workload --max-examples 5
            helm hypothesis run examples/generated-workload
            helm hypothesis generate examples/workload --output /tmp/generated-workload --max-examples 5
            helm hypothesis run /tmp/generated-workload
      - store_test_results:
          path: reports
      - store_artifacts:
          path: dist

workflows:
  verify-all:
    jobs:
      - test-python
