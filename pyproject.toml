[tool.poetry]
name = "hypothesis-helm"
version = "0.1.0"
description = "Property-based Helm chart testing and value-reference auditing"
authors = ["Emma Doyle"]
readme = "README.md"
license = "GPL-3.0-only"
packages = [{include = "hypothesis_helm", from = "pkg"}]
include = [{path = "plugin.yaml", format = ["sdist"]}, {path = "scripts", format = ["sdist"]}]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
hypothesis = "^6.131"
hypothesis-jsonschema = "^0.23"
jsonschema = "^4.23"
"ruamel.yaml" = "^0.18"
attrs = "^25.3"
pytest = "^8.3"
rich = ">=13,<15"
cattrs = ">=25.3,<27"
matplotlib = {version = ">=3.10,<4", optional = true}
numpy = {version = ">=2,<3", optional = true}
reportlab = ">=4,<5"

[tool.poetry.extras]
benchmarking = ["matplotlib", "numpy"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^1.15"
pydoclint = "0.6.6"
pydocstyle = "6.3.0"
pre-commit = "4.6.0"
types-jsonschema = "^4.23"
cogapp = ">=3.6,<4"
matplotlib = ">=3.10,<4"
numpy = ">=2,<3"

[tool.poetry.scripts]
hypothesis-helm = "hypothesis_helm.cli:main"
hypothesis-helm-benchmark = "hypothesis_helm.benchmarking.cli:main"
hypothesis-helm-kubesec = "hypothesis_helm.integrations.kubesec:main"
hypothesis-helm-github-action = "hypothesis_helm.integrations.github_action:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["pkg/hypothesis_helm/tests"]
markers = ["integration: requires Helm", "astrivant: optional neighboring Astrivant chart", "hypothesis_helm_path(path): schema path exercised by a generated test"]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D200", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["pkg"]
disallow_any_explicit = true
disallow_any_unimported = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
allow-init-docstring = true
require-return-section-when-returning-nothing = true
# Pydoclint only sees local raise statements and rejects documented propagated errors.
# Total functions document propagated errors while the CLI boundary renders them.
skip-checking-raises = true
