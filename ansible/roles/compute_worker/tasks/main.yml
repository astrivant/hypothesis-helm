---
- name: Require the supported image and requested local concurrency
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int == 13
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.processor_vcpus | int >= worker_jobs | int
      - helm_version is match('^v4\.[0-9]+\.[0-9]+$')
- name: Install Python, archive tools and worker runtime dependencies
  ansible.builtin.apt:
    name: [python3, python3-venv, python3-pip, acl, ca-certificates, curl, git, tar, gzip, parallel, util-linux]
    update_cache: true
    cache_valid_time: 3600
- name: Create the dedicated computation group
  ansible.builtin.group:
    name: "{{ worker_group }}"
    system: true
- name: Create an unprivileged computation account without an SSH login
  ansible.builtin.user:
    name: "{{ worker_user }}"
    group: "{{ worker_group }}"
    system: true
    create_home: true
    home: "/var/lib/{{ worker_user }}"
    shell: /usr/sbin/nologin
    password_lock: true
- name: Create root-owned application and tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: ["{{ remote_root }}", "{{ remote_root }}/tools", "{{ remote_root }}/runs", "{{ remote_root }}/cache"]
- name: Cache the pinned Helm release and verify its published checksum
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "{{ remote_root }}/tools/helm-{{ helm_version }}.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
    mode: '0644'
- name: Create the versioned Helm directory
  ansible.builtin.file:
    path: "{{ remote_root }}/tools/helm-{{ helm_version }}"
    state: directory
    mode: '0755'
- name: Extract the verified Helm binary
  ansible.builtin.unarchive:
    src: "{{ remote_root }}/tools/helm-{{ helm_version }}.tar.gz"
    dest: "{{ remote_root }}/tools/helm-{{ helm_version }}"
    remote_src: true
    creates: "{{ remote_root }}/tools/helm-{{ helm_version }}/linux-amd64/helm"
- name: Prepare an isolated Poetry installer
  ansible.builtin.command:
    argv: [python3, -m, venv, "{{ remote_root }}/tools/poetry"]
    creates: "{{ remote_root }}/tools/poetry/bin/python"
- name: Install the pinned Poetry version
  ansible.builtin.pip:
    name: "poetry=={{ poetry_version }}"
    executable: "{{ remote_root }}/tools/poetry/bin/pip"
- name: Check the remote run directory
  ansible.builtin.stat:
    path: "{{ remote_run }}"
  register: previous_run
- name: Refuse to replace an existing worker run
  ansible.builtin.assert:
    that: not previous_run.stat.exists
- name: Create isolated source, chart, results and shard cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ worker_user }}"
    group: "{{ worker_group }}"
    mode: '0700'
  loop:
    - "{{ remote_run }}"
    - "{{ remote_run }}/source"
    - "{{ remote_run }}/chart"
    - "{{ remote_run }}/results"
    - "{{ remote_cache }}"
- name: Transfer the exact local source and chart archives
  ansible.builtin.copy:
    src: "{{ local_root }}/{{ item }}.tar.gz"
    dest: "{{ remote_run }}/{{ item }}.tar.gz"
    owner: "{{ worker_user }}"
    group: "{{ worker_group }}"
    mode: '0600'
  loop: [source, chart]
- name: Expand the snapshots as the computation user
  become_user: "{{ worker_user }}"
  ansible.builtin.unarchive:
    src: "{{ remote_run }}/{{ item }}.tar.gz"
    dest: "{{ remote_run }}/{{ item }}"
    remote_src: true
  loop: [source, chart]
- name: Install locked project dependencies and console commands
  become_user: "{{ worker_user }}"
  ansible.builtin.command:
    argv: ["{{ remote_root }}/tools/poetry/bin/poetry", install, --only, main, --extras, benchmarking, --no-interaction, --no-ansi]
    chdir: "{{ remote_run }}/source"
  environment:
    POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    POETRY_VIRTUALENVS_CREATE: 'true'
  changed_when: true
- name: Transfer the snapshotted workload
  ansible.builtin.copy:
    src: "{{ local_root }}/job.sh"
    dest: "{{ remote_run }}/job.sh"
    owner: "{{ worker_user }}"
    group: "{{ worker_group }}"
    mode: '0500'
- name: Write the worker launcher and explicit shard environment
  ansible.builtin.template:
    src: worker.sh.j2
    dest: "{{ remote_run }}/worker.sh"
    owner: root
    group: "{{ worker_group }}"
    mode: '0550'
- name: Launch the bounded process tree without waiting for other replicas
  ansible.builtin.command:
    argv:
      - systemd-run
      - --no-block
      - "--unit={{ unit_name }}"
      - '--property=Type=exec'
      - '--property=ExitType=cgroup'
      - '--property=RemainAfterExit=yes'
      - "--property=User={{ worker_user }}"
      - "--property=Group={{ worker_group }}"
      - "--property=WorkingDirectory={{ remote_run }}/source"
      - "--property=RuntimeMaxSec={{ job_timeout_seconds }}"
      - '--property=TimeoutStopSec=30'
      - '--property=KillMode=control-group'
      - '--property=NoNewPrivileges=yes'
      - '--property=UMask=0077'
      - /bin/bash
      - "{{ remote_run }}/worker.sh"
  changed_when: true
